<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1120">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Thu Chi">
<meta name="referrer" content="no-referrer">
<title>Thu Chi Cá Nhân</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#0B1120; --card:rgba(21,31,53,.72); --card-solid:#141D33; --elev:#1B2540; --field:#0F172A;
  --line:rgba(148,163,184,.14); --line-2:rgba(148,163,184,.26);
  --text:#F1F5F9; --muted:#A3B1C6; --faint:#7C8BA3;
  --primary:#3B82F6; --primary-2:#1E40AF; --primary-soft:rgba(59,130,246,.16); --on-primary:#FFFFFF;
  --in:#34D399; --in-soft:rgba(52,211,153,.14); --out:#F87171; --out-soft:rgba(248,113,113,.14);
  --warn:#FBBF24; --ring:#93C5FD;
  --glow-1:rgba(59,130,246,.22); --glow-2:rgba(16,185,129,.13);
  --shadow:0 12px 32px rgba(2,6,23,.45); --scrim:rgba(2,6,23,.66);
  --r-lg:22px; --r-md:16px; --r-sm:12px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  --ease:cubic-bezier(.2,.8,.2,1); --t-fast:140ms; --t-med:240ms;
  --tabbar-h:72px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#EEF2F8; --card:rgba(255,255,255,.82); --card-solid:#FFFFFF; --elev:#FFFFFF; --field:#F8FAFC;
    --line:rgba(15,23,42,.08); --line-2:rgba(15,23,42,.16);
    --text:#0F172A; --muted:#475569; --faint:#64748B;
    --primary:#1D4ED8; --primary-2:#1E3A8A; --primary-soft:rgba(29,78,216,.10);
    --in:#047857; --in-soft:rgba(4,120,87,.10); --out:#DC2626; --out-soft:rgba(220,38,38,.09);
    --ring:#1D4ED8; --glow-1:rgba(59,130,246,.16); --glow-2:rgba(16,185,129,.12);
    --shadow:0 8px 24px rgba(15,23,42,.08); --scrim:rgba(15,23,42,.45);
    color-scheme:light;
  }
}

/* ============ BASE ============ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:16px; line-height:1.5; color:var(--text); background:var(--bg);
  background-image:radial-gradient(60% 40% at 10% 0%,var(--glow-1),transparent 70%),
                   radial-gradient(50% 35% at 100% 10%,var(--glow-2),transparent 70%);
  background-attachment:fixed; min-height:100vh; -webkit-font-smoothing:antialiased;
}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:10px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic-sm{width:18px;height:18px}.ic-lg{width:28px;height:28px}

/* ============ LAYOUT ============ */
#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + var(--s4)) var(--s4) calc(var(--tabbar-h) + env(safe-area-inset-bottom) + var(--s6))}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);margin-bottom:var(--s4)}
.eyebrow{margin:0;font-size:13px;color:var(--muted);font-weight:500}
.topbar h1{margin:0;font-size:24px;line-height:1.25;font-weight:700;letter-spacing:-.01em}
.top-actions{display:flex;gap:var(--s2)}
.icon-btn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--text);transition:background var(--t-fast) var(--ease)}
.icon-btn:active{background:var(--elev)}
.view{display:none;animation:fade var(--t-med) var(--ease)}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.section{margin-top:var(--s5)}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--s3)}
.section-head h2{margin:0;font-size:17px;font-weight:600}
.link-btn{min-height:44px;padding:0 var(--s2);color:var(--primary);font-weight:600;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}

/* ============ HERO ============ */
.hero{position:relative;overflow:hidden;border-radius:var(--r-lg);padding:var(--s5) var(--s5) var(--s4);color:#fff;
  background:linear-gradient(135deg,#1E40AF 0%,#2563EB 48%,#0F766E 100%);box-shadow:var(--shadow)}
.hero::before{content:"";position:absolute;inset:-40% -20% auto auto;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.12);filter:blur(2px)}
.hero::after{content:"";position:absolute;inset:auto auto -60% -10%;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero>*{position:relative;z-index:1}
.hero-label{display:flex;align-items:center;gap:var(--s2);font-size:14px;opacity:.9;font-weight:500}
.hero-amount{font-size:34px;font-weight:700;line-height:1.2;margin:var(--s1) 0 var(--s4);letter-spacing:-.02em}
.hero-row{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}
.hero-pill{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);border-radius:var(--r-md);padding:var(--s3);display:flex;gap:var(--s2);align-items:center}
.hero-pill .dot{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.18);flex:none}
.hero-pill small{display:block;font-size:12px;opacity:.88}
.hero-pill b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ============ QUICK ACTIONS ============ */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s2);margin-top:var(--s4)}
.qa{display:flex;flex-direction:column;align-items:center;gap:6px;padding:var(--s3) var(--s1);border-radius:var(--r-md);background:var(--card);border:1px solid var(--line);font-size:12.5px;font-weight:500;text-align:center;line-height:1.3;min-height:88px;transition:background var(--t-fast) var(--ease)}
.qa:active{background:var(--elev)}
.qa .qa-ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary)}
.qa.primary .qa-ic{background:var(--primary);color:var(--on-primary);box-shadow:0 6px 16px rgba(37,99,235,.4)}
.qa.cash .qa-ic{background:var(--out-soft);color:var(--out)}
.qa.income .qa-ic{background:var(--in-soft);color:var(--in)}

/* ============ ACCOUNT CARDS ============ */
.acc-scroll{display:flex;gap:var(--s3);overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:var(--s2);margin:0 calc(var(--s4) * -1);padding-left:var(--s4);padding-right:var(--s4);scrollbar-width:none}
.acc-scroll::-webkit-scrollbar{display:none}
.acc-card{scroll-snap-align:start;flex:0 0 72%;max-width:260px;min-height:128px;border-radius:var(--r-md);padding:var(--s4);color:#fff;text-align:left;position:relative;overflow:hidden;
  background:linear-gradient(140deg,var(--c,#334155),color-mix(in srgb,var(--c,#334155) 55%,#020617))}
.acc-card::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.10)}
.acc-card .acc-top{display:flex;justify-content:space-between;align-items:center;gap:var(--s2)}
.acc-card .acc-name{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc-card .acc-no{font-size:13px;opacity:.85;margin-top:2px}
.acc-card .acc-bal{font-size:20px;font-weight:700;margin-top:var(--s4)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.2);white-space:nowrap}
.acc-add{flex:0 0 120px;border:1.5px dashed var(--line-2);border-radius:var(--r-md);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s2);color:var(--muted);font-size:13px;font-weight:500;min-height:128px}

/* ============ TRANSACTIONS ============ */
.tx-list{padding:var(--s1) 0}
.tx{display:flex;align-items:center;gap:var(--s3);width:100%;text-align:left;padding:var(--s3) var(--s4);min-height:64px;transition:background var(--t-fast) var(--ease)}
.tx:active{background:var(--elev)}
.tx+.tx{border-top:1px solid var(--line)}
.cat-ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent)}
.tx-main{flex:1;min-width:0}
.tx-title{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-sub{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-amt{font-weight:700;font-size:15px;white-space:nowrap}
.tx-amt.in{color:var(--in)} .tx-amt.out{color:var(--text)}
.day-head{display:flex;justify-content:space-between;align-items:baseline;padding:var(--s4) var(--s1) var(--s2);font-size:13px;color:var(--muted);font-weight:600}
.empty{padding:var(--s6) var(--s4);text-align:center;color:var(--muted);font-size:14px}
.empty .ic{width:40px;height:40px;color:var(--faint);margin-bottom:var(--s2)}

/* ============ TOOLBARS ============ */
.month-nav{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);padding:var(--s1);margin-bottom:var(--s3)}
.month-nav b{font-size:16px;font-weight:600}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;background:var(--field);border:1px solid var(--line);border-radius:14px}
.seg button{white-space:nowrap;min-height:40px;border-radius:10px;font-size:14px;font-weight:600;color:var(--muted);transition:background var(--t-fast) var(--ease),color var(--t-fast) var(--ease);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--elev);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.search{position:relative;margin-top:var(--s3)}
.search .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search input{padding-left:44px}
.summary3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2);margin-top:var(--s3)}
.sum{padding:var(--s3);border-radius:var(--r-md);background:var(--card);border:1px solid var(--line)}
.sum small{display:block;font-size:12px;color:var(--muted)}
.sum b{display:block;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-in{color:var(--in)} .c-out{color:var(--out)}

/* ============ STATS ============ */
.donut-wrap{display:flex;align-items:center;gap:var(--s5);padding:var(--s5)}
.donut{width:150px;height:150px;border-radius:50%;flex:none;position:relative}
.donut::after{content:"";position:absolute;inset:22px;border-radius:50%;background:var(--card-solid)}
.donut-center{position:absolute;inset:0;display:grid;place-items:center;text-align:center;z-index:1;font-size:12px;color:var(--muted);line-height:1.3}
.donut-center b{display:block;font-size:16px;color:var(--text)}
.legend{flex:1;min-width:0;display:grid;gap:var(--s2);font-size:13px}
.legend div{display:flex;align-items:center;gap:var(--s2)}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-row{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4)}
.cat-row+.cat-row{border-top:1px solid var(--line)}
.cat-row .bar{height:6px;border-radius:6px;background:var(--line);margin-top:6px;overflow:hidden}
.cat-row .bar i{display:block;height:100%;border-radius:6px;background:var(--c)}
.cat-row .pct{font-size:12px;color:var(--muted);font-weight:500}
.bars{display:flex;align-items:flex-end;gap:var(--s3);height:170px;padding:var(--s4) var(--s4) 0}
.bars .m{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%}
.bars .pair{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:4px}
.bars .pair i{width:40%;max-width:16px;border-radius:5px 5px 2px 2px;min-height:3px;transition:height var(--t-med) var(--ease)}
.bars .pair .bi{background:var(--in)} .bars .pair .bo{background:var(--out)}
.bars .lbl{font-size:12px;color:var(--muted);padding-bottom:var(--s3)}
.bars .m.cur .lbl{color:var(--text);font-weight:700}
.chart-legend{display:flex;gap:var(--s4);padding:0 var(--s4) var(--s4);font-size:13px;color:var(--muted)}
.chart-legend span{display:flex;align-items:center;gap:6px}
.chart-legend i{width:10px;height:10px;border-radius:3px}

/* ============ ACCOUNTS VIEW ============ */
.acc-list{display:grid;gap:var(--s3)}
.acc-list .acc-card{max-width:none;width:100%;flex:none}
.setting{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding:var(--s3) var(--s4);min-height:60px;width:100%;text-align:left}
.setting+.setting{border-top:1px solid var(--line)}
.setting .s-ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary);flex:none}
.setting .s-main{flex:1;min-width:0}
.setting .s-main small{display:block;color:var(--muted);font-size:13px}
.switch{position:relative;width:50px;height:30px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--line-2);transition:background var(--t-fast) var(--ease)}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform var(--t-fast) var(--ease)}
.switch input:checked+span{background:var(--primary)}
.switch input:checked+span::after{transform:translateX(20px)}
.switch input:focus-visible+span{outline:2px solid var(--ring);outline-offset:2px}

/* ============ TAB BAR ============ */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 var(--s3) env(safe-area-inset-bottom);
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line)}
.tabbar-inner{max-width:560px;margin:0 auto;height:var(--tabbar-h);display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:60px;font-size:11.5px;font-weight:500;color:var(--faint);transition:color var(--t-fast) var(--ease)}
.tab[aria-current="page"]{color:var(--primary)}
.tab[aria-current="page"] .ic{stroke-width:2.3}
.fab-wrap{display:flex;justify-content:center}
.fab{width:62px;height:62px;border-radius:20px;margin-top:-26px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(140deg,#3B82F6,#1E40AF);box-shadow:0 10px 24px rgba(37,99,235,.5),0 0 0 5px var(--bg);transition:transform var(--t-fast) var(--ease)}
.fab:active{transform:scale(.95)}
.fab .ic{width:28px;height:28px}

/* ============ FORMS ============ */
label.f-label,.f-label{display:block;font-size:13.5px;font-weight:600;color:var(--muted);margin:0 0 6px}
.field{margin-top:var(--s4)}
.input,select.input,textarea.input{width:100%;min-height:50px;padding:12px 14px;border-radius:var(--r-sm);background:var(--field);border:1.5px solid var(--line-2);font-size:16px;transition:border-color var(--t-fast) var(--ease)}
textarea.input{min-height:76px;resize:vertical}
.input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.input[aria-invalid="true"]{border-color:var(--out)}
.err[hidden]{display:none}
.err{color:var(--out);font-size:13px;margin-top:6px;display:flex;gap:6px;align-items:center}
.help{color:var(--faint);font-size:12.5px;margin-top:6px}
.amount-box{position:relative;margin-top:var(--s4);padding:var(--s4);border-radius:var(--r-md);background:var(--field);border:1.5px solid var(--line-2);transition:border-color var(--t-fast) var(--ease)}
.amount-box:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.amount-box.invalid{border-color:var(--out)}
.amount-box label{font-size:13px;color:var(--muted);font-weight:600}
.amount-row{display:flex;align-items:baseline;gap:var(--s2)}
.amount-row input{flex:1;min-width:0;border:0;background:transparent;font-size:32px;font-weight:700;padding:2px 0;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.amount-row input:focus{outline:none}
.amount-row span{font-size:22px;font-weight:600;color:var(--muted)}
.chips{display:flex;gap:var(--s2);overflow-x:auto;margin-top:var(--s3);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 14px;border-radius:999px;background:var(--elev);border:1px solid var(--line);font-size:13.5px;font-weight:600}
.chip:active{background:var(--primary-soft)}
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s2)}
.cat-opt{display:flex;flex-direction:column;align-items:center;gap:6px;padding:var(--s2) 2px;border-radius:var(--r-sm);border:1.5px solid transparent;font-size:12px;font-weight:500;text-align:center;line-height:1.25;min-height:76px;transition:background var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease)}
.cat-opt[aria-checked="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}
.pay-scroll{display:flex;gap:var(--s2);overflow-x:auto;scrollbar-width:none;padding:2px}
.pay-scroll::-webkit-scrollbar{display:none}
.pay-opt{flex:none;min-width:150px;max-width:200px;text-align:left;padding:var(--s3);border-radius:var(--r-sm);border:1.5px solid var(--line-2);background:var(--field);display:flex;gap:var(--s2);align-items:center;transition:border-color var(--t-fast) var(--ease)}
.pay-opt .pay-dot{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;background:var(--c);flex:none;font-size:11px;font-weight:700}
.pay-opt b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pay-opt small{display:block;font-size:12px;color:var(--muted);white-space:nowrap}
.pay-opt[aria-checked="true"]{border-color:var(--primary);background:var(--primary-soft)}
.pay-opt[aria-checked="true"] .check{display:grid}
.pay-opt .check{display:none;margin-left:auto;color:var(--primary)}
.payee{padding:var(--s4);border-radius:var(--r-md);background:var(--field);border:1px solid var(--line);margin-top:var(--s4)}
.payee-head{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);margin-bottom:var(--s2)}
.payee-head b{font-size:14px}
.qr-badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--in-soft);color:var(--in)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}
.copy-row{display:flex;gap:var(--s2);margin-top:var(--s3);flex-wrap:wrap}
.btn{white-space:nowrap;min-height:50px;padding:0 var(--s5);border-radius:14px;font-weight:600;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);transition:transform var(--t-fast) var(--ease),background var(--t-fast) var(--ease),opacity var(--t-fast)}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.55;pointer-events:none}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-ghost{background:var(--elev);border:1px solid var(--line-2)}
.btn-danger{background:var(--out-soft);color:var(--out)}
.btn-sm{min-height:40px;padding:0 14px;font-size:14px;border-radius:12px}
.btn-block{width:100%}
.spin{width:20px;height:20px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* ============ SHEET ============ */
.backdrop{position:fixed;inset:0;background:var(--scrim);z-index:40;opacity:0;pointer-events:none;transition:opacity var(--t-med) var(--ease)}
.backdrop.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:560px;margin:0 auto;max-height:94vh;display:flex;flex-direction:column;
  background:var(--card-solid);border-radius:24px 24px 0 0;border:1px solid var(--line);box-shadow:0 -10px 40px rgba(0,0,0,.35);
  transform:translateY(105%);transition:transform 300ms var(--ease);visibility:hidden}
.sheet.show{transform:none;visibility:visible}
.sheet:focus{outline:none}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:var(--s2) var(--s3) var(--s2) var(--s5);border-bottom:1px solid var(--line)}
.sheet-head::before{content:"";position:absolute;top:8px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:4px;background:var(--line-2)}
.sheet-head h3{margin:var(--s3) 0 0;font-size:18px;font-weight:700}
.sheet-body{overflow-y:auto;padding:var(--s2) var(--s5) var(--s5);overscroll-behavior:contain}
.sheet-foot{padding:var(--s3) var(--s5) calc(var(--s3) + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:var(--s2)}
.sheet-foot .btn{flex:1}
.detail-amt{text-align:center;padding:var(--s5) 0 var(--s4)}
.detail-amt .cat-ic{width:56px;height:56px;border-radius:18px;margin:0 auto var(--s3)}
.detail-amt b{display:block;font-size:30px;font-weight:700;letter-spacing:-.02em}
.kv{display:flex;justify-content:space-between;gap:var(--s4);padding:var(--s3) 0;border-top:1px solid var(--line);font-size:14.5px}
.kv span{color:var(--muted);flex:none}
.kv b{font-weight:600;text-align:right;word-break:break-word}

/* ============ SCANNER ============ */
.scanner{position:fixed;inset:0;z-index:60;background:#000;color:#fff;display:flex;flex-direction:column}
.scanner[hidden]{display:none}
#reader{position:absolute;inset:0;overflow:hidden}
#reader video{width:100%!important;height:100%!important;object-fit:cover}
#reader img{display:none}
.scan-top{position:relative;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + var(--s3)) var(--s4) var(--s3)}
.scan-top b{font-size:17px}
.scan-btn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(15,23,42,.55);backdrop-filter:blur(10px);color:#fff}
.scan-frame-wrap{position:relative;z-index:2;flex:1;display:grid;place-items:center;pointer-events:none}
.scan-frame{width:min(70vw,280px);aspect-ratio:1;position:relative;border-radius:24px;box-shadow:0 0 0 100vmax rgba(2,6,23,.55)}
.scan-frame i{position:absolute;width:38px;height:38px;border:4px solid #fff;border-radius:6px}
.scan-frame i:nth-child(1){top:-2px;left:-2px;border-right:0;border-bottom:0;border-top-left-radius:24px}
.scan-frame i:nth-child(2){top:-2px;right:-2px;border-left:0;border-bottom:0;border-top-right-radius:24px}
.scan-frame i:nth-child(3){bottom:-2px;left:-2px;border-right:0;border-top:0;border-bottom-left-radius:24px}
.scan-frame i:nth-child(4){bottom:-2px;right:-2px;border-left:0;border-top:0;border-bottom-right-radius:24px}
.scan-line{position:absolute;left:10%;right:10%;height:2px;top:12%;background:linear-gradient(90deg,transparent,#60A5FA,transparent);box-shadow:0 0 12px #60A5FA;animation:scanmove 2.2s ease-in-out infinite alternate}
@keyframes scanmove{to{top:86%}}
.scan-status{position:relative;z-index:3;text-align:center;font-size:14.5px;padding:0 var(--s5);margin-bottom:var(--s4);min-height:44px;color:#E2E8F0}
.scan-actions{position:relative;z-index:3;display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2);padding:0 var(--s4) calc(env(safe-area-inset-bottom) + var(--s5))}
.scan-act{display:flex;flex-direction:column;align-items:center;gap:6px;padding:var(--s3) var(--s1);border-radius:var(--r-md);background:rgba(15,23,42,.6);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.12);font-size:13px;font-weight:500;min-height:76px}
.scan-act:active{background:rgba(30,41,59,.85)}

/* ============ TOAST / BOOT ============ */
.toast{position:fixed;left:50%;bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 16px);z-index:80;transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:#0F172A;color:#F8FAFC;border:1px solid rgba(255,255,255,.12);padding:12px 16px;border-radius:14px;font-size:14px;font-weight:500;box-shadow:var(--shadow);display:flex;gap:var(--s2);align-items:center;max-width:calc(100vw - 32px);transition:all var(--t-med) var(--ease)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err .ic{color:#F87171} .toast.ok .ic{color:#34D399}
.skel{border-radius:var(--r-md);background:linear-gradient(90deg,var(--card) 25%,var(--elev) 50%,var(--card) 75%);background-size:200% 100%;animation:sh 1.3s infinite}
@keyframes sh{to{background-position:-200% 0}}
.boot-err{padding:var(--s5);text-align:center}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
@media (max-width:360px){
  .hero-amount{font-size:28px} .quick{gap:6px} .qa{font-size:11.5px}
}
</style>
</head>
<body>

</nav>

<!-- Máy quét QR -->
<div class="scanner" id="scanner" hidden role="dialog" aria-modal="true" aria-label="Quét mã QR">

    <button class="scan-btn" id="scanClose" aria-label="Đóng máy quét"><span data-ic="x"></span></button>

</div>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

const icon = (n, cls='') => `<svg class="ic ${cls}" viewBox="0 0 24 24" aria-hidden="true">${IC[n] || IC.dots}</svg>`;
function paintIcons(root=document){ root.querySelectorAll('[data-ic]').forEach(el=>{ el.outerHTML = icon(el.dataset.ic); }); }

/* =================== NGÂN HÀNG (mã BIN theo chuẩn VietQR/NAPAS) =================== */
const BANKS = [
  ['970436','Vietcombank','#0B7A3E','vcb'],['970415','VietinBank','#0A4C93','icb'],['970418','BIDV','#0B6E6E','bidv'],
  ['970405','Agribank','#9F1D35','vba'],['970422','MB Bank','#1A3D99','mb'],['970407','Techcombank','#C8102E','tcb'],
  ['970416','ACB','#1C4E9D','acb'],['970432','VPBank','#0F7A36','vpb'],['970423','TPBank','#5B2C83','tpb'],
  ['970403','Sacombank','#0A5CA8','stb'],['970437','HDBank','#B91C1C','hdb'],['970441','VIB','#0060A8','vib'],
  ['970443','SHB','#C2410C','shb'],['970431','Eximbank','#1B5DAA','eib'],['970426','MSB','#B91C1C','msb'],
  ['970448','OCB','#047857','ocb'],['970440','SeABank','#B91C1C','seab'],['970449','LPBank','#C2410C','lpb'],
  ['970454','BVBank','#00539B','vccb'],['970429','SCB','#00529C','scb'],['970425','ABBANK','#047857','abb'],
  ['970427','VietABank','#00468E','vab'],['970428','Nam A Bank','#B91C1C','nab'],['970409','Bac A Bank','#92400E','bab'],
  ['970412','PVcomBank','#0E4C92','pvcb'],['970419','NCB','#0A3D7A','ncb'],['970424','Shinhan Bank','#1D4ED8','shbvn'],
  ['970452','KienlongBank','#0369A1','klb'],['970433','VietBank','#00529C','vietbank'],['970438','BaoViet Bank','#0062A3','bvb'],
  ['970400','Saigonbank','#1D4E9E','sgicb'],['970430','PGBank','#0060AF','pgb'],['970414','MBV (OceanBank)','#1A3D99','oceanbank'],
  ['970406','DongA Bank','#0067B1','dob'],['970408','GPBank','#0D4C8C','gpb'],['970457','Woori Bank','#0067AC','wvn'],
  ['970458','UOB','#00205B','uob'],['970421','VRB','#B91C1C','vrb'],['970446','Co-opBank','#006B3F','coopbank'],
  ['970434','Indovina','#BE123C','ivb'],['546034','CAKE','#BE185D','cake'],['546035','Ubank','#6A1B9A','ubank'],
  ['963388','Timo','#5C2D91','timo'],['971005','Viettel Money','#BE123C','viettelmoney'],['971011','VNPT Money','#0369A1','vnptmoney']
].map(([bin,name,color,code])=>({bin,name,color,code}));
const bankByBin = bin => BANKS.find(b=>b.bin===String(bin));

/* =================== MỞ APP NGÂN HÀNG (VietQR Deeplink – dl.vietqr.io) =================== */
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const FALLBACK_APPS = [
  {appId:'bidv',appName:'BIDV SmartBanking',bankName:'BIDV'},{appId:'icb',appName:'VietinBank iPay',bankName:'VietinBank'},
  {appId:'acb',appName:'ACB ONE',bankName:'ACB'},{appId:'ocb',appName:'OCB OMNI',bankName:'OCB'},{appId:'mb',appName:'MB Bank',bankName:'MB Bank'}];
const appById = id => S.bankApps.find(a => a.appId === id);
const shortApp = a => { const b = BANKS.find(x => x.code === a.appId); return b ? b.name : (a.bankName || a.appName || a.appId); };
function guessApp(bin){
  const b = bankByBin(bin); if (!b) return '';
  const hit = S.bankApps.find(a => a.appId === b.code) || S.bankApps.find(a => (a.bankName||'').toLowerCase().includes(b.name.toLowerCase().split(' ')[0]));
  return hit ? hit.appId : '';
}
function appOptions(sel){
  return '<option value="">— Không dùng —</option>' + S.bankApps.map(a => `<option value="${esc(a.appId)}" ${a.appId===sel?'selected':''}>${esc(a.appName || a.bankName)}</option>`).join('');
}
const noAccent = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').replace(/[^A-Za-z0-9 .,\-\/]/g,' ').replace(/\s+/g,' ').trim();
function buildDeeplink(appId, f){
  const bank = bankByBin(f.payeeBin);
  const p = new URLSearchParams({
    app: appId,
    ba: f.payeeAccount + '@' + (bank ? bank.code : f.payeeBin),
    am: String(Math.round(f.amount)),
    tn: noAccent(f.content || f.note || 'Chuyen tien').slice(0, 50),
    url: S.appUrl || 'https://www.vietqr.io'
  });
  if (f.payee) p.set('bn', noAccent(f.payee));
  return 'https://dl.vietqr.io/pay?' + p.toString();
}

/* =================== API (cổng dữ liệu Apps Script + mã khóa bí mật) =================== */
const API_URL = 'https://script.google.com/macros/s/AKfycbxbVtsQcOLF9vULcOcRk-1JKvtim3Dddo2G-DoddrMlgvqgh-fT6rtKVBxD22ftCFGtIA/exec';                     // địa chỉ ứng dụng web Apps Script (/exec)
const USE_MOCK = location.protocol === 'file:' || API_URL.startsWith('__');
// Mã khóa lấy từ đường link cài đặt (#key=...) rồi lưu trong máy, không nằm trong mã nguồn
(function(){ const m = location.hash.match(/key=([A-Za-z0-9]{20,})/); if (m) { try { localStorage.setItem('thuchi_key', JSON.stringify(m[1])); } catch(e){} } })();
const getKey = () => pref('key', '');
async function call(fn, ...args){
  if (USE_MOCK) return MOCK[fn](...args);
  const key = getKey();
  if (!key) throw new Error('NO_KEY');
  let r;
  try {
    r = await fetch(API_URL, { method:'POST', redirect:'follow', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({key, fn, args}) });

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtNum = n => new Intl.NumberFormat('vi-VN').format(Math.round(n || 0));
const fmt = n => fmtNum(n) + ' ₫';
const fmtShort = n => { n = Math.abs(n); if (n >= 1e9) return (n/1e9).toFixed(1).replace('.0','').replace('.',',')+' tỷ'; if (n >= 1e6) return (n/1e6).toFixed(1).replace('.0','').replace('.',',')+' tr'; if (n >= 1e3) return Math.round(n/1e3)+'k'; return String(Math.round(n)); };
const pad = n => String(n).padStart(2,'0');
const monthKey = d => { d = new Date(d); return d.getFullYear()+'-'+pad(d.getMonth()+1); };
const shiftMonth = (k, n) => { const [y,m] = k.split('-').map(Number); return monthKey(new Date(y, m-1+n, 1)); };
const monthLabel = k => { const [y,m] = k.split('-'); return `Tháng ${Number(m)}/${y}`; };
const hhmm = t => { const d = new Date(t); return pad(d.getHours())+':'+pad(d.getMinutes()); };
const WD = ['Chủ nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];
function dayLabel(t){
  const d = new Date(t), today = new Date(); const y = new Date(); y.setDate(today.getDate()-1);
  const same = (a,b)=>a.toDateString()===b.toDateString();
  if (same(d,today)) return 'Hôm nay, '+pad(d.getDate())+'/'+pad(d.getMonth()+1);
  if (same(d,y)) return 'Hôm qua, '+pad(d.getDate())+'/'+pad(d.getMonth()+1);
  return WD[d.getDay()]+', '+pad(d.getDate())+'/'+pad(d.getMonth()+1);
}
const toLocalInput = t => { const d = new Date(t); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const digits = s => String(s||'').replace(/\D/g,'');
const maskNo = n => n ? '•••• ' + String(n).slice(-4) : '';
function pref(k, d){ try { const v = localStorage.getItem('thuchi_'+k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } }
function setPref(k, v){ try { localStorage.setItem('thuchi_'+k, JSON.stringify(v)); } catch(e){} }
const errMsg = e => (e && e.message) ? e.message.replace(/^Exception:\s*/,'') : String(e);

let toastTimer;
function toast(msg, kind='ok'){
  const t = $('#toast');
  t.className = 'toast show ' + kind;
  t.innerHTML = icon(kind === 'ok' ? 'check' : 'alert', 'ic-sm') + '<span>'+esc(msg)+'</span>';
  clearTimeout(toastTimer); toastTimer = setTimeout(()=> t.className = 'toast', 2800);
}
async function copyText(text, label){
  try { await navigator.clipboard.writeText(text); toast('Đã sao chép '+label); }
  catch(e){ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy'); toast('Đã sao chép '+label);}catch(_){toast('Không sao chép được','err');} ta.remove(); }
}

let sheetOnClose = null, lastFocus = null;
function openSheet(html, onClose){
  lastFocus = document.activeElement;
  const sh = $('#sheet'); sh.innerHTML = html; sheetOnClose = onClose || null;
  $('#backdrop').classList.add('show'); sh.classList.add('show'); document.body.classList.add('lock');
  setTimeout(()=>{ const f = sh.querySelector('[data-autofocus]') || sh; f.focus({preventScroll:true}); }, 320);
}
function closeSheet(){
  $('#backdrop').classList.remove('show'); $('#sheet').classList.remove('show'); document.body.classList.remove('lock');
  if (sheetOnClose) { const f = sheetOnClose; sheetOnClose = null; f(); }
  lastFocus && lastFocus.focus && lastFocus.focus({preventScroll:true});
}
const sheetHead = title => `<div class="sheet-head"><h3 id="sheetTitle">${esc(title)}</h3><button class="icon-btn" style="background:none;border:0" data-close aria-label="Đóng">${icon('x')}</button></div>`;
function confirmBox(title, msg, okLabel, onOk){
  openSheet(`${sheetHead(title)}<div class="sheet-body"><p style="margin:16px 0 0;color:var(--muted)">${msg}</p></div>
    <div class="sheet-foot"><button class="btn btn-ghost" data-close>Hủy</button><button class="btn btn-danger" id="cfOk">${icon('trash','ic-sm')}${esc(okLabel)}</button></div>`);

}

/* =================== KẾT NỐI ĐIỆN THOẠI (mã QR chứa link cài đặt) =================== */
const QR_LIB = 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';
function loadScript(src){
  return new Promise((res, rej) => { if (window.qrcode) return res(); const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
}
async function openPairSheet(){
  const link = location.href.split('#')[0] + '#key=' + getKey();
  openSheet(`${sheetHead('Kết nối điện thoại')}
    <div class="sheet-body">
      <p style="margin:16px 0 0;color:var(--muted);font-size:14.5px">Mở <b>Camera</b> trên iPhone, quét mã dưới đây rồi chạm vào đường link hiện ra. Ứng dụng sẽ mở với mã khóa điền sẵn; sau đó chọn <b>Chia sẻ → Thêm vào MH chính</b>.</p>
      <div id="pairQr" style="background:#fff;color:#0F172A;padding:14px;border-radius:16px;width:max-content;max-width:100%;margin:16px auto">Đang tạo mã…</div>
      <p class="err" style="justify-content:center">${icon('alert','ic-sm')}Mã này mở được dữ liệu của bạn — đừng chụp gửi cho người khác.</p>
    </div>
    <div class="sheet-foot"><button class="btn btn-ghost" id="pairCopy">${icon('copy','ic-sm')}Chép link</button><button class="btn btn-primary" data-close>Xong</button></div>`);
  $('#pairCopy').onclick = () => copyText(link, 'link cài đặt');
  try {
    await loadScript(QR_LIB);
    const q = qrcode(0, 'M'); q.addData(link); q.make();
    $('#pairQr').innerHTML = q.createSvgTag({cellSize: 5, margin: 2});
  } catch(e) { $('#pairQr').textContent = 'Không tạo được mã QR — hãy dùng nút Chép link.'; }
}

function readForm(){
  if (!F) return;
  const v = id => { const el = document.getElementById(id); return el ? el.value : undefined; };
  F.amount = Number(digits(v('fAmt'))) || 0;
  if (v('fBank') !== undefined) F.payeeBin = v('fBank');
  if (v('fPAcc') !== undefined) F.payeeAccount = v('fPAcc').trim();
  if (v('fPayee') !== undefined) F.payee = v('fPayee').trim();
  if (v('fContent') !== undefined) F.content = v('fContent').trim();
  F.note = (v('fNote')||'').trim();
  const tv = v('fTime'); if (tv) { const d = new Date(tv); if (!isNaN(d)) F.time = d.getTime(); }
}
function updateSaveLabel(){
  if (!F) return;
  const amt = Number(digits(($('#fAmt')||{}).value)) || 0;
  const lbl = $('#fSaveLbl');
  if (lbl) lbl.textContent = (F.mode === 'income' ? 'Lưu khoản thu' : 'Lưu khoản chi') + (amt ? ' ' + fmt(amt) : '');
  const pl = $('#fPayLbl');
  if (pl) { const acc = accById(F.accountId), app = acc && appById(acc.appId); pl.textContent = app ? 'Mở app ' + shortApp(app) : 'Chuyển & ghi sổ'; }
}
async function saveTx(openApp){
  readForm();
  let ok = true;
  const showErr = (id, box, bad) => { $('#'+id).hidden = !bad; if (box) box.classList.toggle('invalid', bad); };
  if (!(F.amount > 0)) { showErr('amtErr', $('#amtBox'), true); ok = false; } else showErr('amtErr', $('#amtBox'), false);
  if (!F.accountId) { $('#payErr').hidden = false; ok = false; }
  if (!ok) { (F.amount > 0 ? $('#payLbl') : $('#fAmt')).scrollIntoView({block:'center', behavior:'smooth'}); if(!(F.amount>0)) $('#fAmt').focus({preventScroll:true}); return; }

  const acc = accById(F.accountId);
  const tx = {
    id:F.id, time:F.time, type:F.mode==='income'?'Thu':'Chi',
    method: F.mode==='transfer' ? (F.qr ? 'QR' : 'Chuyển khoản') : (acc && acc.type==='Ngân hàng' ? 'Chuyển khoản' : 'Tiền mặt'),
    accountId:F.accountId, amount:F.amount, category:F.category,
    payee:F.mode==='transfer'?F.payee:'', payeeAccount:F.mode==='transfer'?F.payeeAccount:'',
    payeeBank:F.mode==='transfer'?((bankByBin(F.payeeBin)||{}).name||''):'',
    content:F.mode==='transfer'?F.content:'', note:F.note, qr:F.mode==='transfer'?F.qr:''
  };
  if (openApp) {
    const missing = !F.payeeBin ? 'ngân hàng nhận' : !F.payeeAccount ? 'số tài khoản nhận' : !(acc && acc.appId) ? '' : '';
    if (missing) { toast('Vui lòng nhập ' + missing, 'err'); return; }
    if (!(acc && acc.appId)) { toast('Tài khoản ' + (acc ? acc.name : '') + ' chưa chọn app ngân hàng — vào Tài khoản để chọn', 'err'); return; }
    // Mở app ngay trong thao tác bấm để không bị trình duyệt chặn, đồng thời ghi sổ
    const link = buildDeeplink(acc.appId, F);
    const w = window.open(link, '_blank');
    if (!w) { const aEl = document.createElement('a'); aEl.href = link; aEl.target = '_blank'; aEl.rel = 'noopener'; document.body.appendChild(aEl); aEl.click(); aEl.remove(); }
    tx.note = tx.note || 'Chuyển qua app ' + shortApp(appById(acc.appId) || {appId:acc.appId});
  }
  const btn = $(openApp ? '#fPay' : '#fSave'); const btnHtml = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Đang lưu…';
  try {
    const saved = await call('saveTransaction', tx);
    S.txs = S.txs.filter(t => t.id !== saved.id); S.txs.push(saved); S.txs.sort((a,b)=>b.time-a.time);
    closeSheet(); renderAll(); toast(openApp ? 'Đã ghi sổ. Nếu hủy chuyển khoản, hãy xóa giao dịch này.' : tx.id ? 'Đã cập nhật giao dịch' : 'Đã lưu ' + (tx.type==='Thu'?'khoản thu ':'khoản chi ') + fmt(saved.amount));
  } catch(e) {
    btn.disabled = false; btn.innerHTML = btnHtml; updateSaveLabel(); toast((openApp ? 'App đã mở nhưng chưa ghi sổ được: ' : '') + errMsg(e),'err');
  }
}

      <button class="btn btn-primary" id="aSave">${icon('check','ic-sm')}Lưu tài khoản</button>
    </div>`);
    const sync = () => {
      const g = x => document.getElementById(x);
      if (g('aBank')) { a.bin = g('aBank').value; a.bank = (bankByBin(a.bin)||{}).name || ''; }
      if (g('aNo')) a.number = g('aNo').value.replace(/\s/g,'');
      if (g('aApp')) a.appId = g('aApp').value;
      a.name = g('aName').value.trim(); a.opening = Number(digits(g('aOpen').value)) || 0;
      if (g('aDef')) a.isDefault = g('aDef').checked;
    };
    $('#sheet').querySelectorAll('[data-atype]').forEach(b => b.onclick = () => { sync(); a.type = b.dataset.atype; draw(); });
    const bankSel = $('#aBank');
    if (bankSel) bankSel.onchange = () => { const nm = $('#aName'); const b = bankByBin(bankSel.value); if (b && (!nm.value || BANKS.some(x=>x.name===nm.value))) nm.value = b.name; const ap = $('#aApp'); if (ap) ap.innerHTML = appOptions(guessApp(bankSel.value)); };
    $('#aOpen').oninput = e => { const d = digits(e.target.value); e.target.value = d ? fmtNum(Number(d)) : ''; };
    $('#aSave').onclick = async () => {
      sync();
      const badBank = a.type === 'Ngân hàng' && !a.bin, badName = !a.name;
      if ($('#aBankErr')) $('#aBankErr').hidden = !badBank; $('#aNameErr').hidden = !badName;
      if (badBank || badName) return;
      a.color = a.type === 'Ngân hàng' ? (bankByBin(a.bin)||{}).color : '#0E9F6E';
      const btn = $('#aSave'); btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Đang lưu…';
      try {
        S.accounts = await call('saveAccount', a);
        closeSheet(); renderAll(); toast('Đã lưu tài khoản');
        if (afterSave) setTimeout(afterSave, 220);
      } catch(e) { btn.disabled = false; btn.innerHTML = icon('check','ic-sm')+'Lưu tài khoản'; toast(errMsg(e),'err'); }
    };
    if ($('#aDel')) $('#aDel').onclick = () => confirmBox('Xóa tài khoản?', `Tài khoản <b>${esc(a.name)}</b> sẽ bị xóa. Chỉ xóa được khi chưa có giao dịch nào.`, 'Xóa', async () => {
      S.accounts = await call('deleteAccount', a.id); closeSheet(); renderAll(); toast('Đã xóa tài khoản');
    });
  };
  draw();
}

/* =================== ĐỌC MÃ QR (VietQR / EMVCo) =================== */
function tlv(s){
  const out = {}; let i = 0;
  while (i + 4 <= s.length) {
    const tag = s.substr(i, 2), len = parseInt(s.substr(i + 2, 2), 10);
    if (isNaN(len)) break;
    out[tag] = s.substr(i + 4, len); i += 4 + len;
  }
  return out;
}
function parseQR(raw){
  raw = String(raw || '').trim();
  const r = {raw, valid:false, bin:'', account:'', name:'', amount:0, content:''};
  if (/^000201/.test(raw)) {
    const t = tlv(raw);
    for (let k = 26; k <= 51; k++) {
      const v = t[String(k)]; if (!v) continue;
      const sub = tlv(v);
      if (sub['01'] && (sub['00'] === 'A000000727' || /^\d{6}/.test(tlv(sub['01'])['00'] || ''))) {
        const ben = tlv(sub['01']); r.bin = ben['00'] || ''; r.account = ben['01'] || ''; break;
      }
    }
    r.amount = t['54'] ? Math.round(parseFloat(t['54'])) || 0 : 0;
    r.name = (t['59'] || '').trim();
    if (t['62']) { const a = tlv(t['62']); r.content = (a['08'] || a['05'] || '').trim(); }
    r.valid = !!(r.bin && r.account);
  } else if (/^2\|99\|/.test(raw)) {               // mã QR cá nhân MoMo (dạng cũ)
    const p = raw.split('|'); r.account = p[2] || ''; r.name = p[3] || ''; r.amount = Number(p[5]) || 0; r.bin = '971025'; r.valid = !!r.account;
  }
  return r;
}

let qrCam = null, scanning = false, scanHandled = false;
const setScanStatus = s => $('#scanStatus').textContent = s;
async function openScanner(){
  if ($('#sheet').classList.contains('show')) closeSheet();
  $('#scanner').hidden = false; document.body.classList.add('lock'); scanHandled = false;
  setScanStatus('Đang mở camera…');
  if (!window.Html5Qrcode) { setScanStatus('Không tải được thư viện quét. Hãy chọn "Ảnh có mã QR" hoặc "Nhập tay".'); return; }
  try {
    const cfg = {verbose:false, experimentalFeatures:{useBarCodeDetectorIfSupported:true}};
    if (window.Html5QrcodeSupportedFormats) cfg.formatsToSupport = [Html5QrcodeSupportedFormats.QR_CODE];
    qrCam = qrCam || new Html5Qrcode('reader', cfg);
    await qrCam.start({facingMode:'environment'}, {fps:12, disableFlip:true}, onScanned, ()=>{});
    scanning = true; setScanStatus('Đưa mã QR chuyển khoản vào trong khung');
  } catch(e) {
    scanning = false;
    setScanStatus('Không mở được camera. Bấm "Ảnh có mã QR" để chụp hoặc chọn ảnh mã QR.');
  }
}
async function stopCam(){ if (qrCam && scanning) { try { await qrCam.stop(); } catch(e){} } scanning = false; }
async function closeScanner(){ await stopCam(); $('#scanner').hidden = true; document.body.classList.remove('lock'); }
async function onScanned(text){
  if (scanHandled) return; scanHandled = true;
  if (navigator.vibrate) navigator.vibrate(40);
  await closeScanner(); handleQrText(text);
}
function handleQrText(text){
  const p = parseQR(text);
  const bank = bankByBin(p.bin);
  openTxForm('transfer', {
    qr: p.raw.slice(0, 500), payeeBin: bank ? bank.bin : '', payeeAccount: p.account, payee: p.name,
    amount: p.amount, content: p.content, note: p.valid ? '' : (p.raw.length < 120 ? p.raw : '')
  });
  if (!p.valid) toast('Mã QR không theo chuẩn VietQR — hãy kiểm tra lại thông tin', 'err');
  else if (!bank) toast('Chưa nhận ra ngân hàng (mã ' + p.bin + '), vui lòng chọn tay', 'err');
}
// Thu nhỏ ảnh chụp (ảnh iPhone 12–48MP) để đọc mã nhanh và ổn định hơn
function shrinkImage(file, max){
  return new Promise(res => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => res(b ? new File([b], 'qr.jpg', {type:'image/jpeg'}) : file), 'image/jpeg', 0.92);
    };
    img.onerror = () => { URL.revokeObjectURL(url); res(file); };
    img.src = url;
  });
}
async function scanFromFile(file){
  if (!file) return;
  setScanStatus('Đang đọc mã QR trong ảnh…'); toast('Đang đọc mã QR…');
  try {
    await stopCam();
    if (!window.Html5Qrcode) throw new Error('lib');
    const reader = new Html5Qrcode('qrFileBox');
    let text = null;
    for (const size of [1280, 2000, 800]) {          // thử vài kích thước cho chắc
      try { text = await reader.scanFile(await shrinkImage(file, size), false); break; } catch(_) {}
    }
    if (!text) text = await reader.scanFile(file, false);
    scanHandled = true; await closeScanner(); handleQrText(text);
  } catch(e) {
    const m = 'Không đọc được mã QR. Chụp lại gần hơn, đủ sáng, mã nằm trọn trong ảnh — hoặc nhập tay.';
    setScanStatus(m); toast(m, 'err');
  } finally { $('#qrFile').value = ''; }
}

/* =================== SỰ KIỆN =================== */
function act(name){
  if (name === 'scan') return openScanner();
  if (name === 'transfer') return openTxForm('transfer');
  if (name === 'cash') return openTxForm('cash');
  if (name === 'income') return openTxForm('income');
  if (name === 'pair') return openPairSheet();
  if (name === 'addAcc') {
    const resume = F ? {...F} : null;
    if ($('#sheet').classList.contains('show')) closeSheet();
    return setTimeout(()=>openAccForm(null, resume ? () => openTxForm(resume.mode, resume) : null), 200);
  }
}
document.addEventListener('click', e => {
  const el = e.target.closest('button, [data-close]'); if (!el) return;
  const d = el.dataset;
  if ('close' in d) return closeSheet();
  if (d.view) return go(d.view);
  if (d.go) return go(d.go);
  if (d.act) return act(d.act);
  if (d.tx) return openTxDetail(d.tx);
  if (d.acc) return openAccForm(d.acc);
  if (d.month) { S.histMonth = shiftMonth(S.histMonth, Number(d.month)); return renderHistory(); }
  if (d.smonth) { S.statMonth = shiftMonth(S.statMonth, Number(d.smonth)); return renderStats(); }
  if (d.htype) { S.histType = d.htype; return renderHistory(); }
  /* trong form giao dịch */
  if (F && d.mode) { readForm(); F.mode = d.mode; if (d.mode !== 'transfer') F.qr = ''; pickDefaultAccount(); return renderTxForm(true); }
  if (F && d.pay) { F.accountId = d.pay; $('#payErr').hidden = true; document.querySelectorAll('[data-pay]').forEach(b => b.setAttribute('aria-checked', b.dataset.pay === d.pay)); updateSaveLabel(); return; }
  if (F && d.cat) { F.category = d.cat; document.querySelectorAll('[data-cat]').forEach(b => b.setAttribute('aria-checked', b.dataset.cat === d.cat)); return; }
  if (F && d.amt) { const i = $('#fAmt'); i.value = fmtNum(Number(d.amt)); $('#amtErr').hidden = true; $('#amtBox').classList.remove('invalid'); updateSaveLabel(); return; }
  if (F && d.copy) { readForm(); return d.copy === 'acc' ? copyText(F.payeeAccount, 'số tài khoản') : copyText(F.content, 'nội dung'); }
  if (el.id === 'fSave') return saveTx(false);
  if (el.id === 'fPay') return saveTx(true);
});
document.addEventListener('input', e => {
  if (e.target.id === 'fAmt') {
    const dg = digits(e.target.value).replace(/^0+/, '').slice(0, 13);
    e.target.value = dg ? fmtNum(Number(dg)) : '';
    if (dg) { $('#amtErr').hidden = true; $('#amtBox').classList.remove('invalid'); }
    updateSaveLabel();
  }
  if (e.target.id === 'q') {
    S.q = e.target.value; const pos = e.target.selectionStart;
    renderHistory(); const q = $('#q'); q.focus(); try { q.setSelectionRange(pos, pos); } catch(_) {}
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'setAuto') { S.autoScan = e.target.checked; setPref('autoScan', S.autoScan); toast(S.autoScan ? 'Sẽ mở máy quét khi vào app' : 'Đã tắt tự mở máy quét'); }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!$('#scanner').hidden) closeScanner(); else if ($('#sheet').classList.contains('show')) closeSheet();
});
$('#backdrop').onclick = closeSheet;
$('#fab').onclick = openScanner;
$('#scanClose').onclick = closeScanner;
$('#scanManual').onclick = async () => { await closeScanner(); openTxForm('transfer'); };
$('#scanCash').onclick = async () => { await closeScanner(); openTxForm('cash'); };
$('#scanImage').onclick = () => $('#qrFile').click();
$('#qrFile').onchange = e => scanFromFile(e.target.files[0]);
$('#btnEye').onclick = () => { S.hide = !S.hide; setPref('hide', S.hide); renderAll(); };
$('#btnReload').onclick = () => boot(true);

/* =================== KHỞI ĐỘNG =================== */
function skeleton(){
  $('#v-home').innerHTML = `<div class="skel" style="height:190px;border-radius:22px"></div>
    <div class="quick">${'<div class="skel" style="height:88px"></div>'.repeat(4)}</div>
    <div class="skel" style="height:128px;margin-top:24px"></div><div class="skel" style="height:260px;margin-top:24px"></div>`;
}
async function boot(reload){
  paintIcons(); paintEye();
  const rb = $('#btnReload'); rb.innerHTML = icon('reload'); rb.disabled = true;
  if (!reload) skeleton();
  try {
    const d = await call('getInitData');
    S.accounts = d.accounts; S.cats = d.categories; S.txs = d.txs.sort((a,b)=>b.time-a.time); S.sheetUrl = d.sheetUrl; S.appUrl = location.href.split('#')[0];
    const apps = (IS_IOS ? (d.bankApps||{}).ios : (d.bankApps||{}).android) || []; S.bankApps = apps.length ? apps : FALLBACK_APPS;
    renderAll(); go(S.view);
    if (reload) toast('Đã cập nhật dữ liệu mới nhất');
    else if (S.autoScan) openScanner();
  } catch(e) {
    const m = errMsg(e);
    if (m === 'NO_KEY' || m === 'BAD_KEY') { go('home'); return keyScreen(m === 'BAD_KEY'); }
    $('#v-home').innerHTML = `<div class="card boot-err">${icon('alert','ic-lg')}<p>Không tải được dữ liệu:<br><b>${esc(m)}</b></p><button class="btn btn-primary" onclick="boot()">Thử lại</button></div>`;
  } finally { rb.disabled = false; }
}
function keyScreen(bad){
  $('#v-home').innerHTML = `<div class="card" style="padding:24px">
    <div class="cat-ic" style="--c:var(--primary);margin-bottom:12px">${icon('star')}</div>
    <h2 style="margin:0 0 6px;font-size:19px">Nhập mã khóa</h2>
    <p style="margin:0;color:var(--muted);font-size:14.5px">Mã khóa giúp chỉ bạn đọc và ghi được dữ liệu thu chi. Mở bằng đường link cài đặt sẽ tự điền mã.</p>
    <div class="field"><label class="f-label" for="kIn">Mã khóa</label><input id="kIn" class="input" autocomplete="off" autocapitalize="off" spellcheck="false" ${bad?'aria-invalid="true"':''}>
    ${bad?`<div class="err">${icon('alert','ic-sm')}Mã khóa không đúng hoặc đã được đổi</div>`:''}</div>
    <button class="btn btn-primary btn-block" style="margin-top:16px" id="kSave">${icon('check','ic-sm')}Lưu và tải dữ liệu</button></div>`;
  $('#kSave').onclick = () => { const v = $('#kIn').value.trim(); if (!v) return $('#kIn').focus(); setPref('key', v); boot(); };
}
boot();
</script>
